<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/ui-kit.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <title>Pupupu</title>
  </head>
  <body>
    <div class="container">
      <div class="box green"></div>
      <div class="box blue"></div>
      <div class="box yellow"></div>
      <div class="box white"></div>
      <div class="box purple"></div>
      <div class="box red"></div>
      <div class="box black"></div>
    </div>

    <div class="container_buttons">
      <div class="default">
        <div class="state">default</div>
        <button class="button more">Подробнее</button>
        <button class="button registration">Зарегистрироваться</button>
        <button class="button work">Начать работу</button>
        <button class="button tryfree">Попробовать бесплатно</button>
      </div>

      <div class="hover">
        <div class="state">hover</div>
        <button class="button more">Подробнее</button>
        <button class="button registration">Зарегистрироваться</button>
        <button class="button work">Начать работу</button>
        <button class="button tryfree">Попробовать бесплатно</button>
      </div>

      <div class="click">
        <div class="state">click</div>
        <button class="button more">Подробнее</button>
        <button class="button registration">Зарегистрироваться</button>
        <button class="button work">Начать работу</button>
        <button class="button tryfree">Попробовать бесплатно</button>
      </div>
    </div>

    <div class="headline">
      <h1 class="headline-1">Headline 1</h1>
      <h2 class="headline-2">Headline 2</h2>
      <h3 class="headline-3">Headline 3</h3>
      <h4 class="headline-4">Headline 4</h4>
      <p class="text">Text</p>
      <p class="text-2">Text 2</p>
      <p class="text-3">Text 3</p>

      <p class="menu">MENU</p>

      <h1 class="mobile">Headline 1 mobile</h1>
      <h2 class="mobile">Headline 2 mobile</h2>
    </div>
  </body>
</html>
